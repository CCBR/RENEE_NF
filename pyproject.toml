[build-system]
requires = [
    "setuptools >= 62.3.0",
    "wheel >= 0.29.0",
]
build-backend = 'setuptools.build_meta'

[project]
name = 'RENEE_NF'
dynamic = ['version','readme']
description = "Nextflow implementation of RENEE, an open-source, reproducible, and scalable solution for analyzing RNA-seq data. For original implementation see : https://ccbr.github.io/RENEE/latest/"
keywords = ["bioinformatics", "nextflow"]
authors = [
    {name = "Kelly Sovacool", email = "kelly.sovacool@nih.gov"},
    {name = "Vishal Koparde", email = "vishal.koparde@nih.gov"},
    {name = "Alec Silver",    email = "alecs@bu.edu"}
]
maintainers = [
    {name = "CCR Collaborative Bioinformatics Resource", email = "ccbr@mail.nih.gov"},
]
license = {file = "LICENSE"}
classifiers = [
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT license",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"

dependencies = [
    "ccbr_tools@git+https://github.com/CCBR/Tools",
    "cffconvert@git+https://github.com/citation-file-format/cffconvert@b6045d78aac9e02b039703b030588d54d53262ac",
    "Click >= 8.1.3",
    "pyyaml >= 6.0"
]

[project.optional-dependencies]
dev = [
    "black >= 22.0.0",
    "pre-commit",
    "nf-core >= 3.2.0"
]
test = [
    "pytest"
]

[project.scripts]
renee_nf = "renee_nf.src.__main__:main"

[project.urls]
Homepage = "https://ccbr.github.io/RENEE_NF"
Documentation = "https://ccbr.github.io/RENEE_NF"
Repository = "https://github.com/CCBR/RENEE_NF"
Changelog = "https://github.com/CCBR/RENEE_NF/blob/main/CHANGELOG.md"

[tool.setuptools.package-dir]
renee_nf = "."

[tool.setuptools.package-data]
"*" = ["CITATION.cff", "LICENSE", "VERSION", "main.nf", "nextflow.config", "nextflow_schema.json", "assets/**", "bin/**", "conf/**", "lib/**", "modules/**", "subworkflows/**", "workflows/**", "tests/**"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
readme = {file = "README.md"}

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
RENEE_NF = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }

[tool.pixi.tasks]
