[build-system]
requires = [
    "setuptools >= 62.3.0",
    "wheel >= 0.29.0",
]
build-backend = 'setuptools.build_meta'

[project]
name = 'RENEE_NF_ALEC'
dynamic = ['version','readme']
description = "TODO insert description of RENEE_NF_ALEC here"
keywords = ["bioinformatics", "nextflow"]
authors = [
    {name = "Kelly Sovacool", email = "kelly.sovacool@nih.gov"},
    {name = "Vishal Koparde", email = "vishal.koparde@nih.gov"},
]
maintainers = [
    {name = "CCR Collaborative Bioinformatics Resource", email = "ccbr@mail.nih.gov"},
]
license = {file = "LICENSE"}
classifiers = [
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT license",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "ccbr_tools@git+https://github.com/CCBR/Tools",
    "cffconvert@git+https://github.com/citation-file-format/cffconvert@b6045d78aac9e02b039703b030588d54d53262ac",
    "Click >= 8.1.3",
    "pyyaml >= 6.0"
]

[project.optional-dependencies]
dev = [
    "black >= 22.0.0",
    "pre-commit",
    "nf-core >= 3.2.0"
]
test = [
    "pytest"
]

[project.scripts]
renee_nf_alec = "renee_nf_alec.src.__main__:main"

[project.urls]
Homepage = "https://ccbr.github.io/RENEE_NF_ALEC"
Documentation = "https://ccbr.github.io/RENEE_NF_ALEC"
Repository = "https://github.com/CCBR/RENEE_NF_ALEC"
Changelog = "https://github.com/CCBR/RENEE_NF_ALEC/blob/main/CHANGELOG.md"

[tool.setuptools.package-dir]
renee_nf_alec = "."

[tool.setuptools.package-data]
"*" = ["CITATION.cff", "LICENSE", "VERSION", "main.nf", "nextflow.config", "nextflow_schema.json", "assets/**", "bin/**", "conf/**", "lib/**", "modules/**", "subworkflows/**", "workflows/**", "tests/**"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}
readme = {file = "README.md"}
