name: build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  NFT_DIFF: "pdiff"
  NFT_DIFF_ARGS: "--line-numbers --width 120 --expand-tabs=2"
  NFT_VER: "0.9.5"
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false
  NXF_SINGULARITY_CACHEDIR: ${{ github.workspace }}/.singularity
  NXF_SINGULARITY_LIBRARYDIR: ${{ github.workspace }}/.singularity

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      matrix:
        python-version:
          - "3.14"
        NXF_VER:
          - "25.10.4"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install .[dev,test]

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: pytest
        run: |
          python -m pytest
      - name: lint nxf
        if: always()
        run: |
          nf-core pipelines schema lint
      - name: Stub run
        run: |
          mkdir -p tmp && pushd tmp
          renee_nf init
          renee_nf run -profile ci_stub -stub --mode local
          popd
      - name: Build mode stub run
        run: |
          mkdir -p tmp && pushd tmp
          renee_nf init
          renee_nf run -profile ci_stub \
            -stub --mode local --outputDir output \
            --build \
            --download_shared_resources
          popd
      - name: "Upload Artifact"
        uses: actions/upload-artifact@v7
        if: always() # run even if previous steps fail
        with:
          name: nextflow-log
          path: .nextflow.log

  nf-test-changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      nf_test_files: ${{ steps.list.outputs.components }}
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: List nf-test files
        id: list
        uses: adamrtalbot/detect-nf-test-changes@accef9459c66baa65dbca647615f088b98eefa9c
        with:
          head: ${{ github.sha }}
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/master' }}
          include: .github/include.yml
          # Re-specify detector defaults and add CITATION.cff; resync when upgrading the action.
          ignored: >-
            .git/* .gitpod.yml .prettierignore .prettierrc.yml *.md *.png
            modules.json pyproject.toml tower.yml CITATION.cff
      - name: print list of nf-test files
        run: |
          echo ${{ steps.list.outputs.components }}

  test:
    name: "Run tests (${{ matrix.nf_test_files }} ${{ matrix.profile }})"
    needs: [nf-test-changes]
    if: needs.nf-test-changes.outputs.nf_test_files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nf_test_files:
          ["${{ fromJson(needs.nf-test-changes.outputs.nf_test_files) }}"]
        profile:
          - "docker"
        NXF_VER:
          - "25.10.4"
        isMaster:
          - ${{ github.base_ref == 'master' }}
        # Exclude conda and singularity on dev
        exclude:
          - isMaster: false
            profile: "singularity"
    steps:
      - name: Check out pipeline code

        uses: actions/checkout@v7

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v3
        with:
          version: "${{ matrix.NXF_VER }}"

      - name: Set up Apptainer
        if: matrix.profile == 'singularity'
        uses: eWaterCycle/setup-apptainer@main

      - name: Set up Singularity
        if: matrix.profile == 'singularity'
        run: |
          mkdir -p $NXF_SINGULARITY_CACHEDIR
          mkdir -p $NXF_SINGULARITY_LIBRARYDIR

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v2
        with:
          version: ${{ env.NFT_VER }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install pdiff to see diff between nf-test snapshots
        run: |
          python -m pip install --upgrade pip
          pip install pdiff

      - name: Clean up Disk space
        uses: jlumbroso/free-disk-space@v1.3.1

      - name: Run nf-test
        run: |
          nf-test test --verbose ${{ matrix.nf_test_files }} --profile "+${{ matrix.profile }}" --junitxml=test.xml --tap=test.tap

      - uses: pcolby/tap-summary@v1
        with:
          path: >-
            test.tap
      - name: Output log on failure
        if: failure()
        run: |
          sudo apt install bat > /dev/null
          batcat --decorations=always --color=always ${{ github.workspace }}/.nf-test/tests/*/meta/nextflow.log
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: test.xml

  build-status: # https://github.com/orgs/community/discussions/4324#discussioncomment-3477871
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Successful build
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Failing build
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
